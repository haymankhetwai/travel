<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-200 flex justify-center items-center min-h-screen">
    
    <main class="bg-white max-w-md space-y-5 p-8 rounded-2xl h-auto shadow-xl shadow-indigo-300">
        <div class="w-full flex justify-center ">
            <img src="lock.png" alt="profile" class="w-12 p-2  rounded-xl bg-indigo-50 object-contain">
        </div>
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold mb-2">Welcome Back</h1>
            <p class="text-slate-500">Enter your credentials to access your account</p>
        </div>
        <form class="space-y-4">
             <div class="flex flex-col gap-2">
                <label for="emailAdd" class="text-medium text-slate-600 font-bold">Email Address</label>
                <input type="email" id="emailAdd" placeholder="name@company.com" class="w-full border rounded-lg px-2 py-3  bg-slate-100 text-slate-600  outline-none"> 
            </div>
            <div class="flex flex-col gap-2">
                <label for="password" class="text-medium text-slate-600 font-bold">Password</label>
                <input type="password" id="password" placeholder="........" class="w-full border rounded-lg px-2 py-3 bg-slate-100  outline-none">
            </div>
            <div class="flex justify-between gap-2">
                <div class="flex items-center gap-2">
                    <input type="checkbox" class="w-4 h-4">
                <p>
                    Remember me
                </p>
                </div>
                <div>
                    <a href="" class="text-blue-500 font-bold">Forgot password?</a>
                </div>
            </div>
            <div class="w-full px-4 py-3 bg-blue-700 rounded-lg text-white text-medium font-bold text-center hover:bg-blue-500 shadow-md shadow-indigo-400 transition duration-500 ease-in-out">
                <button>Log In ➜</button>
            </div>
        </form>
        <div class="text-center">
                <p>Don't have an account yet? <a href="register.html" class="text-blue-700 font-bold text-sm ">Sign up for free</a></p>
            </div>
    </main>
    
</body>
</html>
